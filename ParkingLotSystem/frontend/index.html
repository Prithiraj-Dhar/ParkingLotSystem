<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Parking Lot Management System</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >
</head>

<body>

<header class="header">

    <div class="container">

        <h1>🚗 Parking Lot Management</h1>

        <p>
            Manage vehicles, parking spots and tickets
        </p>

    </div>

</header>


<main class="container">

    <!-- Dashboard Statistics -->

    <section class="dashboard">

        <div class="stat-card">
            <h3>Total Spots</h3>
            <p id="totalSpots">0</p>
        </div>

        <div class="stat-card">
            <h3>Available</h3>
            <p id="availableSpots">0</p>
        </div>

        <div class="stat-card">
            <h3>Occupied</h3>
            <p id="occupiedSpots">0</p>
        </div>

    </section>


    <!-- Vehicle Entry -->

    <section class="card">

        <h2>🚘 Vehicle Entry</h2>

        <form id="entryForm">

            <div class="form-group">

                <label for="licensePlate">
                    License Plate
                </label>

                <input
                        type="text"
                        id="licensePlate"
                        placeholder="ABC123"
                        required
                >

            </div>


            <div class="form-group">

                <label for="vehicleType">
                    Vehicle Type
                </label>

                <select id="vehicleType" required>

                    <option value="">
                        Select vehicle type
                    </option>

                    <option value="MOTORCYCLE">
                        Motorcycle
                    </option>

                    <option value="CAR">
                        Car
                    </option>

                    <option value="TRUCK">
                        Truck
                    </option>

                </select>

            </div>


            <button type="submit">
                Park Vehicle
            </button>

        </form>

    </section>


    <!-- Ticket -->

    <section
            class="card ticket-card"
            id="ticketSection"
            hidden
    >

        <h2>🎫 Parking Ticket</h2>

        <div class="ticket">

            <p>
                <strong>Ticket ID:</strong>
                <span id="ticketId"></span>
            </p>

            <p>
                <strong>License Plate:</strong>
                <span id="ticketLicensePlate"></span>
            </p>

            <p>
                <strong>Vehicle Type:</strong>
                <span id="ticketVehicleType"></span>
            </p>

            <p>
                <strong>Parking Spot:</strong>
                <span id="ticketSpot"></span>
            </p>

        </div>

    </section>


    <!-- Vehicle Exit -->

    <section class="card">

        <h2>🚪 Vehicle Exit</h2>

        <form id="exitForm">

            <div class="form-group">

                <label for="exitTicketId">
                    Ticket ID
                </label>

                <input
                        type="text"
                        id="exitTicketId"
                        placeholder="T001"
                        required
                >

            </div>

            <button type="submit">
                Exit Vehicle
            </button>

        </form>

    </section>


    <!-- Fare -->

    <section
            class="card fare-card"
            id="fareSection"
            hidden
    >

        <h2>💰 Parking Fare</h2>

        <p>
            Parking Duration:
            <strong id="parkingDuration"></strong>
        </p>

        <p>
            Total Fare:
            <strong id="totalFare"></strong>
        </p>

    </section>


    <!-- Parking Spots -->

    <section class="card">

        <h2>🅿️ Parking Spots</h2>

        <div
                id="parkingGrid"
                class="parking-grid"
        >

            <!-- JavaScript will generate spots -->

        </div>

    </section>


    <!-- Messages -->

    <div
            id="message"
            class="message"
    ></div>

</main>


<script src="js/app.js"></script>

</body>

</html>
